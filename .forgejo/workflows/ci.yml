# Forgejo Actions pipeline for codeberg.org/Archaejon/Guidebook.
#
# Runs on Codeberg's shared runners. The job uses the official Node 20 image,
# the oldest major line the README supports, so CI catches anything that would
# break for users below the development machine's Node 22. That image tracks the
# latest 20.x, which satisfies Vite 7's 20.19+ floor, and already carries the
# git client the checkout action needs.
name: CI

on:
  push:
    # `pages` holds build output only: there is no package.json there, so a run
    # on that branch would fail on `npm ci` and report a broken deploy that
    # isn't broken. It is verified by the deploy workflow instead.
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: codeberg-small
    container:
      image: node:20-bookworm
    steps:
      - name: Check out the repository
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies from the lockfile
        run: npm ci

      # Only the dependencies that ship to a browser. The test runner and build
      # tooling are never served, so an advisory in them is a development risk
      # to review, not a reason to block a release of the site.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev

      # Kept as separate steps so a failure names the phase that broke.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
