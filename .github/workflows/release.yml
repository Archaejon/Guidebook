# Creates the GitHub release for a version tag.
#
# Pushing a `vX.Y.Z` tag is the whole release: this job takes the notes from
# CHANGELOG.md for that version and publishes them as the release. The script is
# idempotent, so re-running a failed job updates the entry instead of
# duplicating it, and it refuses a tag whose version disagrees with
# package.json.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, for example v1.0.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/create-release.mjs
